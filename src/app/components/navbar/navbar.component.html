    @if (authenticated && user) {
      @if(user.photo_profile_path){
        <img src="{{ user.photo_profile_path }}" alt="Foto de perfil" (click)="toggleMenu()" class="logo user-image">
      }@else {
        <img src="assets/user-icon.png" alt="" (click)="toggleMenu()" class="logo user-image">
      }
    } @else {
      <img src="assets/user-icon-1.png" alt="" (click)="toggleMenu()" class="logo user-image">
    }

    <button
      pButton
      type="button"
      class="p-button-text button-lang"
      style="width: 60px; height: 40px; border-radius: 4px;"
      [raised]="true" severity="secondary"
      (click)="op.toggle($event)"
    ><img [src]="'assets/'+selectedLanguage+'.svg'" [alt]="selectedLanguage+'.svg'" width="25px"> {{ selectedLanguage | uppercase }}</button>
    <p-overlayPanel #op [appendTo]="'body'">
      <div class="flag-option" (click)="changeLanguage('de'); op.hide()">
        <img src="assets/de.svg" alt="gb.svg" width="25px"> Deutsch
      </div>
      <div class="flag-option" (click)="changeLanguage('en'); op.hide()">
        <img src="assets/en.svg" alt="gb.svg" width="25px"> English
      </div>
      <div class="flag-option" (click)="changeLanguage('es'); op.hide()">
        <img src="assets/es.svg" alt="gb.svg" width="25px"> Spanish
      </div>
    </p-overlayPanel>
  </div>


  @if (isMenuOpen) {
  <div class="dropdown-menu">
    <ng-container *ngIf="authenticated">
      <a class="dropdown-item">{{ 'POPUP_USER.PROFILE' | translate }}</a>
      <a class="dropdown-item" (click)="logout()">{{ 'POPUP_USER.LOGOUT' | translate }}</a>
    </ng-container>
    <ng-container *ngIf="!authenticated">
      <a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#loginModal">{{ 'POPUP_USER.SIGN_IN' | translate }}</a>
      <a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#registerModal">{{ 'POPUP_USER.SIGN_UP' | translate }}</a>
    </ng-container>
  </div>
  }
