<ng-container *ngIf="isCreateMode;  else deleteTemplate">
  <form [formGroup]="createCountryForm" (ngSubmit)="onSubmit()">
    <div class="create-form m-4">
      <!-- Error message general -->
      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle me-2"></i>
        {{ errorMessage | translate }}
      </div>

      <div class="form-field mb-2 d-flex align-items-start">
        <div class="label-column">
          <label for="name" class="form-label">{{ "COUNTRIES.LABEL.NAME" | translate }}</label>
        </div>
        <div class="input-column">
          <input
            #countryNameInput
            pInputText
            type="text"
            id="name"
            formControlName="name"
            autocomplete="off"
            [class.error]="createCountryForm.get('name')?.invalid && createCountryForm.get('name')?.touched"
          />
          <div class="error-message" *ngIf="createCountryForm.get('name')?.invalid && createCountryForm.get('name')?.touched">
            <small *ngIf="createCountryForm.get('name')?.errors?.['required']">
              {{ "COUNTRIES.ERROR.COUNTRY_NAME_REQUIRED" | translate }}
            </small>
            <small *ngIf="createCountryForm.get('name')?.errors?.['minlength']">
              El nombre debe tener al menos 2 caracteres
            </small>
          </div>
        </div>
      </div>

      <div class="form-field mb-2 d-flex align-items-start">
        <div class="label-column">
          <label for="areaCode" class="form-label">{{ "COUNTRIES.LABEL.AREA_CODE" | translate }}</label>
        </div>
        <div class="input-column">
          <input
            pInputText
            type="text"
            id="areaCode"
            formControlName="areaCode"
            autocomplete="off"
            [class.error]="createCountryForm.get('areaCode')?.invalid && createCountryForm.get('areaCode')?.touched"
          />
          <div class="error-message" *ngIf="createCountryForm.get('areaCode')?.invalid && createCountryForm.get('areaCode')?.touched">
            <small *ngIf="createCountryForm.get('areaCode')?.errors?.['required']">
              El código de área es requerido
            </small>
          </div>
        </div>
      </div>

      <div class="form-field mb-2 d-flex align-items-start">
        <div class="label-column">
          <label for="prefix" class="form-label">{{ "COUNTRIES.LABEL.PREFIX" | translate }}</label>
        </div>
        <div class="input-column">
          <input
            pInputText
            type="number"
            id="prefix"
            formControlName="prefix"
            autocomplete="off"
            [class.error]="createCountryForm.get('prefix')?.invalid && createCountryForm.get('prefix')?.touched"
          />
          <div class="error-message" *ngIf="createCountryForm.get('prefix')?.invalid && createCountryForm.get('prefix')?.touched">
            <small *ngIf="createCountryForm.get('prefix')?.errors?.['required']">
              El prefijo es requerido
            </small>
            <small *ngIf="createCountryForm.get('prefix')?.errors?.['min']">
              El prefijo debe ser mayor a 0
            </small>
          </div>
        </div>
      </div>

      <div class="form-actions mt-3">  
        <button
            type="submit"
            class="bttn btn-save"
            [disabled]="createCountryForm.invalid || isLoading">
            <i class="bi bi-check-lg"></i>
            {{ 'BUTTONS.SAVE' | translate }}
        </button>

        <button
            type="button" 
            class="bttn btn-cancel"
            (click)="closeModal()">
            <i class="bi bi-x-lg"></i>
            {{ 'BUTTONS.CANCEL' | translate }}
        </button> 
      </div>
    </div>
  </form>
</ng-container>
<ng-template #deleteTemplate>
  <div class="confirmation-content mb-2 mt-4">
    <p class="mb-4">
      {{ 'COUNTRIES.DELETE.CONFIRM_QUESTION' | translate }}
      <strong class="stronglock mt-1">"{{ countryName }}"</strong>?
    </p>

    <div class="form-actions">
        <button 
            type="button"
            class="bttn btn-delete"
            [disabled]="isLoading"
            (click)="onDeleteConfirm()">
            <i class="bi bi-trash"></i>
            {{ 'BUTTONS.DELETE' | translate }}
        </button>
      
        <button 
            type="button" 
            class="bttn btn-cancel"
            [disabled]="isLoading"
            (click)="onCancel()">
            <i class="bi bi-x-lg"></i>
            {{ 'BUTTONS.CANCEL' | translate }}
        </button>
    </div>
  </div>
</ng-template>
