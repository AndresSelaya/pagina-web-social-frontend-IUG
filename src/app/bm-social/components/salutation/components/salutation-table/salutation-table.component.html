<div class="container">
  <div class="row">
    <div class>
      <app-general-table
        [tableId]="tableKey"
        [tableValues]="salutations()"
        [columns]="salutationDisplayedColumns"
        [dataKeys]="dataKeys"
        [removeKey]="'id'"
        (onColumnChanges)="onUserSalutationPreferencesChanges($event)"
        (onCreateRegister)="handleTableEvents({ type: 'create' })"
        (onDeleteRegister)="handleTableEvents({ type: 'delete', data: $event })"
        (onEditRegister)="editSalutation($event)"
      ></app-general-table>

      <p-dialog 
        [header]="modalType === 'create' 
          ? ('SALUTATION.FORM.SALUTATION_FORM' | translate) 
          : ('SALUTATION.DELETE.CONFIRMATION' | translate)" 
        [modal]="true" 
        [(visible)]="visibleModal" 
        (onShow)="onDialogShow()"
      >
        <app-salutation-modal
          [modalType]="modalType"
          [salutationName]="salutationName"
          [salutationToDelete]="selectedSalutation"
          (isVisibleModal)="onModalVisibilityChange($event)"
          #salutationModal
        ></app-salutation-modal>
      </p-dialog>
    </div>
  </div>
</div>
