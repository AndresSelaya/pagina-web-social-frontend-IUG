<div class="title-form-container">
    <h3 class="form-title">{{ 'TITLE.LABEL.EDIT_TITLE' | translate }}</h3>

    <form [formGroup]="editTitleForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
            <label for="title" class="field-label">{{ 'TITLE.LABEL.TITLE_LABEL' | translate }}</label>
            <input pInputText 
                type="text" 
                id="title" 
                formControlName="title"
                class="form-input" 
                [ngClass]="{'error': editTitleForm.get('title')?.invalid && editTitleForm.get('title')?.touched}" 
                autocomplete="off" 
            />
            <small 
                class="error-message" 
                *ngIf="editTitleForm.get('title')?.invalid && editTitleForm.get('title')?.touched && editTitleForm.get('title')!.hasError('required')">
                {{ 'TITLE.ERROR.TITLE_LABEL_REQUIRED' | translate }}
            </small>  
        </div>
        <div class="form-actions">
            <button 
                type="submit" 
                class="btn-save"
                [disabled]="editTitleForm.invalid || !editTitleForm.dirty || isSaving">
                <i class="bi bi-check-lg"></i>
                {{ 'BUTTONS.SAVE' | translate }}
            </button>
            <button 
                type="button" 
                class="btn-cancel"
                (click)="clearForm()">
                <i class="bi bi-x-lg"></i>
                {{ 'BUTTONS.CANCEL' | translate }}
            </button>
        </div>
    </form>
</div>
<p-toast />
