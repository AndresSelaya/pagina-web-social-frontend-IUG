<div class="container">
  <div class="row">
    <app-general-table

      [tableValues]="events"
      [columns]="columnsHeaderFieldEvents"

      [removeKey]="'uuid'"
      (onRowClickEvent)="onViewEvent($event)"

    <app-event-modal></app-event-modal>
  </div>
</div>
