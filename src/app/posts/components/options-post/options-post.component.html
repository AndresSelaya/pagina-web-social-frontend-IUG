<div class="menu-options-post" #menuOptions>
    <div *ngIf="postReference" class="option-post" (click)="openModalEditPost(postReference)">
        <i class="bi bi-pencil-fill"></i>
        <p class="fw-medium m-0">{{ 'POSTS.EDIT_POST' | translate }}</p>
    </div>
    <div class="option-post" [attr.data-bs-target]="'#delete-'+postReference" data-bs-toggle="modal">
        <i class="bi bi-trash-fill"></i>
        <p class="fw-medium m-0">{{ 'POSTS.DELETE_POST' | translate }}</p>
    </div>
</div>
