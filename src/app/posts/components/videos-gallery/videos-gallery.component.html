<div class="video-gallery">
  <h2 class="gallery-title">{{ 'OPTIONS.VIDEOS' | translate }}</h2>
  <div *ngIf="isLoading" class="loading-message">
    {{ 'COMMON.LABELS.LOADING_VIDEOS' | translate }}...
  </div>
  <div class="gallery-container" *ngIf="!isLoading && videos.length > 0">
    @for (video of videos; track video.url) {
    <video [src]="video.url" muted playsinline class="video" controls  (click)="openViewPost(video.postUuid)"></video>
    }
  </div>
  <div class="no-videos" *ngIf="!isLoading && videos.length === 0">
    {{ 'COMMON.LABELS.NO_VIDEOS' | translate }}
  </div>
</div>
