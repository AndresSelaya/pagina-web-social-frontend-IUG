<h1 class="products">{{ 'NAVBAR_PAGES.PRODUCT' | translate }}</h1>
<div *ngIf="loading" class="loading">Cargando eventos...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<!--<button class="open-event-form-btn" (click)="openEventForm()">Crear nuevo evento</button>-->

<div class="flash-cards-container" *ngIf="!loading && !error">
  <div *ngFor="let event of events" class="flash-card">
    <div class="event-cover">
      <img [src]="'assets/iug.jpg'" alt="Portada evento" />
      <span class="event-type-label">{{ event.status }}</span>
      <button class="participants-fab" (click)="openParticipantsModal(event)" title="Ver participantes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7" cy="8" r="3" fill="#1976d2"/>
          <circle cx="17" cy="8" r="3" fill="#1976d2"/>
          <ellipse cx="7" cy="17" rx="5" ry="3" fill="#1976d2"/>
          <ellipse cx="17" cy="17" rx="5" ry="3" fill="#1976d2"/>
        </svg>
      </button>
    </div>
    <div class="event-content">
      <h3 class="event-title">{{ event.title }}</h3>
      <div class="event-meta">
        <span class="event-date">{{ event.startDate | date:'fullDate' }}<span *ngIf="event.startDate">, {{ event.startDate | date:'shortTime' }}</span></span>
        <span class="event-location">{{ event.location }}</span>
      </div>
      <div class="event-extra">
        <span class="event-capacity">{{ event.maxCapacity }} capacidad</span>
        <span class="event-public">{{ event.isPublic ? 'Públic' : 'Internal' }}</span>
      </div>
      <div class="event-actions">
        <button class="register-btn">Registrarse</button>
        <button class="details-btn" disabled>See details</button>
      </div>
    </div>
  </div>

<app-participants-modal
  [show]="showParticipantsModal"
  [event]="selectedEvent"
  [participants]="participants"
  [loading]="participantsLoading"
  [error]="participantsError"
  (close)="closeParticipantsModal()"
></app-participants-modal>

<div *ngIf="showEventForm" class="event-form-modal">
  <div class="event-form-backdrop" (click)="closeEventForm()"></div>
  <div class="event-form-dialog">
    <button class="close-btn" (click)="closeEventForm()">&times;</button>
    <app-event-form (eventCreated)="onEventCreated()"></app-event-form>
  </div>
</div>
