<div *ngIf="loading" class="loading">Cargando eventos...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<div class="flash-cards-container" *ngIf="!loading && !error">
  <div *ngFor="let product of products" class="flash-card">
    <div class="card-header">
      <div class="event-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="16" rx="3" fill="#1976d2"/>
          <rect x="1" y="3" width="22" height="18" rx="4" stroke="#1976d2" stroke-width="2"/>
          <rect x="7" y="9" width="10" height="2" rx="1" fill="#fff"/>
          <rect x="7" y="13" width="6" height="2" rx="1" fill="#fff"/>
          <rect x="16" y="1" width="2" height="6" rx="1" fill="#fff"/>
          <rect x="6" y="1" width="2" height="6" rx="1" fill="#fff"/>
        </svg>
      </div>
      <button class="participants-btn" (click)="openParticipantsModal(product)" title="Ver participantes">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7" cy="8" r="3" fill="#1976d2"/>
          <circle cx="17" cy="8" r="3" fill="#1976d2"/>
          <ellipse cx="7" cy="17" rx="5" ry="3" fill="#1976d2"/>
          <ellipse cx="17" cy="17" rx="5" ry="3" fill="#1976d2"/>
        </svg>
      </button>
    </div>
    <h3>{{ product.productName }}</h3>
    <div class="event-dates">
      <span *ngIf="product.initDateTime">Inicio: {{ product.initDateTime | date:'medium' }}</span>
      <span *ngIf="product.endDateTime">Fin: {{ product.endDateTime | date:'medium' }}</span>
    </div>
    <div class="event-type">Tipo: {{ product.productType.typeName }}</div>
    <div class="event-price">Precio: {{ product.price | currency:'EUR':'symbol':'1.2-2' }}</div>
  </div>

<app-participants-modal
  [show]="showParticipantsModal"
  [product]="selectedProduct"
  [participants]="participants"
  [loading]="participantsLoading"
  [error]="participantsError"
  (close)="closeParticipantsModal()"
></app-participants-modal>
